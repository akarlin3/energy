function narrative(prev,ns,dv,streak,dev,notes){
const nm={E:'E',B:'B',Fv:'F_vis',Fb:'F_body',A:'A',Ds:'Ds'};
const mv=Object.keys(nm).map(k=>({k,d:ns[k]-prev[k]})).sort((a,b)=>Math.abs(b.d)-Math.abs(a.d)).slice(0,3).filter(m=>Math.abs(m.d)>=.005).map(m=>`${nm[m.k]} ${r2(prev[m.k])}→${r2(ns[m.k])}`);
const imp=Math.abs(ns.A-.5)<Math.abs(prev.A-.5);
let s=[mv.length?`Largest moves: ${mv.join(', ')}.`:'State essentially flat.'];
s.push(`F is ${dv.drv}-driven at ${r2(dv.F)}; Γ_arousal ${r2(dv.G)} with A ${imp?'recovering toward':'drifting from'} A* (${r2(ns.A)}).`);
s.push(dv.num<=0?`I* numerator ${r3(dv.num)}: singularity active, intake is net-depleting.`:`I* numerator ${r3(dv.num)}: positive intake capacity.`);

function auditMd(e){
const L=[`### ${e.hhmm} ${e.tz||'ET'} · Block: ${e.label} (${e.dt} min) ${e.status}`,'','| | Value |','|---|---|',
`| F | ${r2(e.F)} (${e.drv}-driven) |`,`| Γ_arousal | ${r2(e.G)} (${e.imp?'↑':'↓'} A ${e.imp?'recovering':'drifting'}) |`,
`| A_inst / A_inst,eff | ${r2(e.Ai)} / ${r2(e.Ae)} |`,`| I* numerator | ${r3(e.num)} → ${e.num<=0?(e.drain===false?'Non-binding (rested)':'Singularity active'):'positive'} |`,
`| Prescribed | ${e.prevRoute||'none'} |`,`| Actual | ${String(e.activity||e.label).replace(/\s*\n\s*/g,' ').replace(/\|/g,'/')} |`,...(e.task?[`| Task | ${String(e.task).replace(/\s*\n\s*/g,' ').replace(/\|/g,'/')} |`]:[]),...(e.nextTask?[`| Next Task | ${String(e.nextTask).replace(/\s*\n\s*/g,' ').replace(/\|/g,'/')} |`]:[]),`| Late-phase circadian | ${e.late?'Yes':'No'} |`,`| Desired / suggested | ${e.plan?`${e.plan.wl||'No preference'} / ${e.plan.sl} (fit ${r2(e.plan.fit)})`:'n/a'} |`,`| Ds | ${r2(e.Dse)} |`,`| Engagement (smoothed V) | ${r2(e.vc!=null?e.vc:e.state.V)} |`,''];
if(e.flags.length){e.flags.forEach(f=>L.push('🚩 **'+f+'**'));L.push('')}

L.push(e.narr,'');
if(e.iv)L.push(`Micro-Contract: ${e.iv.micro||'—'} · Project: ${e.iv.project||'—'}`,`Landing Strip — Completed: ${e.iv.done||'—'}`,`Landing Strip — Next cursor: ${e.iv.next||'—'}`,'');

if(e.plan)L.push('',`**Plan:** ${e.plan.head} ${e.plan.detail}`);
L.push('',`**Route: ${e.routeE} ${e.routeN}.** ${e.routeRx}${e.alt?` Runner-up: ${e.alt}.`:''}`);return L.join('\n')}

const EST_SYS=`You estimate control inputs for a capacity-tracking model from a short description of what a person did during one block of time. Return ONLY a JSON object, no prose, no code fences.
Variables, each 0 to 1 averaged over the block:
I_vis: visual intake load (0 none; 0.3 light glancing or familiar video; 0.7 sustained reading or screens; 1 constant dense visual stream).
I_aud: auditory intake load (spoken content, lectures, podcasts, calls; 0 silence).
I_anchor: familiar lyrical music on repeat used as a sensory anchor (1 if playing the whole block; 0 if none).
O_1: primary generative output (0 none; 0.3 light notes or journaling; 0.6 sustained writing, coding, problem solving; 0.9 first-time derivation or design at full effort).
O_anchor: kinetic anchor such as treadmill, pacing, stretching, or a tactile fidget (0 none; 1 whole block).
C_in: cognitive density of the intake (0 trivial or familiar; 1 dense and novel). Use 0 if there was no intake.
P: external pressure (deadlines, other people waiting, stakes).
S_agency: operator autonomy (1 fully self-directed; 0 fully imposed).
Also return: cls, the activity class for V, one of rest, meta, light, research, deep (meta = system building, org, admin; light = light or familiar reading; research = research, writing, problem solving; deep = first-time derivation or design; rest = rest or recovery).
deviated: true only if a prescription is given and the description clearly departs from it, else false. dev_notes: short, empty if not deviated.
rationale: one or two sentences naming which description details drove the values, and which values are guesses because the description was silent. Do not invent details. When the description is silent on a variable, use a conservative mid or low value and say so.
Schema: {"I_vis":0,"I_aud":0,"I_anchor":0,"O_1":0,"O_anchor":0,"C_in":0,"P":0,"S_agency":0,"cls":"research","deviated":false,"dev_notes":"","rationale":""}`;

const j=await callAI(EST_SYS,{description:d.activity,duration_min:d.dt,prescription:S.route?{route:S.routeName,rule:S.routeRx}:null},900);
if(!S.draft)return;

}catch(e){aiErr=String(e.message||e);toast('Estimate failed: '+aiErr.slice(0,170),6000)}
